server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;

    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Exam and study-pack JSON changes whenever the repo does. Revalidate.
    location /data/ {
        add_header Cache-Control "no-cache";
    }

    # The app uses BrowserRouter, so a deep link like
    # /architect-foundations/exam/short/short-practice-exam-3 is not a real file.
    # Without this, refreshing mid-exam returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
