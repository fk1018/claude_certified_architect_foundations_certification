services:
  ccafc:
    build:
      context: .
      dockerfile: cli/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    environment:
      TERM: xterm-256color

  ccdvf:
    extends:
      service: ccafc
    entrypoint: ["uv", "run", "--project", "/app/cli", "ccdvf"]

  ccarp:
    extends:
      service: ccafc
    entrypoint: ["uv", "run", "--project", "/app/cli", "ccarp"]
