[project]
name = "ccafc-cli"
version = "0.1.0"
description = "Terminal study app for the Claude Certified Architect Foundations certification workspace."
requires-python = ">=3.14"
dependencies = [
    "questionary>=2.1.0",
    "rich>=14.0.0",
    "typer>=0.16.0",
]

[project.scripts]
ccafc = "ccafc_cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"
